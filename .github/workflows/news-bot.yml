name: News Keyword Watch

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:          # lets you trigger it manually from the Actions tab

permissions:
  contents: write            # needed so the workflow can commit seen_links.json back

jobs:
  check-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run news keyword bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python news_keyword_bot.py

      - name: Commit updated seen_links.json
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add seen_links.json
          git diff --staged --quiet || git commit -m "Update seen links"
          git push
